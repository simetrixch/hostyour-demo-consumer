suspended: false
quiesced: false
image:
  pullPolicy: IfNotPresent
  pullSecretName: hostyour-demo-consumer-registry-pull
clusterIssuer: ""   # empty: the installation's own, read from global.clusterIssuer
# Delivered by the platform's consumers ApplicationSet: the unit's host.
unitHost: ""
app:
  resources:
    requests: { cpu: "10m", memory: "32Mi" }
    limits:   { cpu: "100m", memory: "64Mi" }
