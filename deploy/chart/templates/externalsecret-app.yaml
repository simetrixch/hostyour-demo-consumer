{{- /*
Materializes the app Secret from THIS consumer's Vault entry <env>/consumer/hostyour-demo-consumer/app,
which the Manager writes at onboarding with the keys deploy/platform.yaml declares (PROBE_TOKEN). The
mount prefix comes from the SecretStore's path; the four defaulted fields of the extract are written
out, or the live object drifts from the desired one.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Values.appSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/consumer/%s/app" (required "global.env comes from the platform $values chain; for a local render pass --set global.env=<stage>" .Values.global.env) .Chart.Name }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
