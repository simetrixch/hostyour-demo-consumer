{{- /*
Points the External Secrets Operator at the platform's Vault through the shared consumer-eso role,
whose policy scopes reads to this namespace's own path secret/<env>/consumer/hostyour-demo-consumer/*.
*/ -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ required "global.endpoints.vault.url comes from the platform $values chain" .Values.global.endpoints.vault.url | quote }}
      path: {{ required "global.vaultKvMount comes from the platform $values chain" .Values.global.vaultKvMount | quote }}
      version: v2
      namespace: vault
      auth:
        kubernetes:
          mountPath: {{ required "global.vaultKubernetesAuthPath comes from the platform $values chain" .Values.global.vaultKubernetesAuthPath | quote }}
          role: consumer-eso
          serviceAccountRef:
            name: external-secrets-sa
