# The pull credential for this consumer's image in the platform's registry (manifest
# `registry-pull`, ServiceClaim service `registry`).
apiVersion: platform.hostyour.cloud/v1alpha1
kind: ServiceClaim
metadata:
  name: registry-pull
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    # Before the Deployment's wave 0: Argo CD holds the next wave until this claim is Ready, and the
    # provisioner marks it Ready only once it has written the Secret the pod reads.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  service: registry
  secretName: {{ .Values.image.pullSecretName }}
