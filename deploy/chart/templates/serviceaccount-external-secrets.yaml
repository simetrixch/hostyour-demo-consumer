# The identity the SecretStore logs in to Vault with; the two annotations bind the login to this unit
# and its stage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    vault.hashicorp.com/alias-metadata-unit: {{ .Chart.Name | quote }}
    vault.hashicorp.com/alias-metadata-stage: {{ required "global.env comes from the platform $values chain (the unit's own stage)" .Values.global.env | quote }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
