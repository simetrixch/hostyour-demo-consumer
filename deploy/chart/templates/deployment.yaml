{{- /* The off state renders no pod: a suspended or quiesced unit takes no writes while it is moved or backed up. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostyour-demo-consumer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: {{ if or .Values.suspended .Values.quiesced }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ include "demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # The connection strings the provisioner writes into each ServiceClaim's Secret. Until a
            # claim has reconciled, the pod waits in CreateContainerConfigError and starts once it has.
            - name: REDIS_URI
              valueFrom:
                secretKeyRef: { name: {{ .Values.redis.secretName }}, key: REDIS_URI }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.mariadb.secretName }}, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
