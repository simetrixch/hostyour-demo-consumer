{{- /* The off state renders no pod: a suspended or quiesced unit takes no writes while it is moved or backed up. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostyour-demo-consumer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: {{ if or .Values.suspended .Values.quiesced }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      securityContext:
        # Numeric, because the kubelet cannot verify that a named user is not root.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ include "demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # The connection strings the provisioner writes into each ServiceClaim's Secret. The claims
            # and the ExternalSecret stand in wave -1, so every Secret this pod reads exists before it starts.
            - name: REDIS_URI
              valueFrom:
                secretKeyRef: { name: {{ .Values.redis.secretName }}, key: REDIS_URI }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.mariadb.secretName }}, key: DATABASE_URL }
            - name: PROBE_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.appSecretName }}, key: PROBE_TOKEN }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Liveness asks only whether the process serves: an outage of Redis or MariaDB takes the pod
          # out of the Service (readiness) and does not restart it.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
