# The consumer's MariaDB: the provisioner creates the manifest's databases (handed in as
# mongodb.databases, the key the platform uses for every data service) and a user granted them, and
# writes DATABASE_URL into the Secret named here.
apiVersion: platform.hostyour.cloud/v1alpha1
kind: ServiceClaim
metadata:
  name: mariadb
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    # Before the Deployment's wave 0: Argo CD holds the next wave until this claim is Ready, and the
    # provisioner marks it Ready only once it has written the Secret the pod reads.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  service: mariadb
  databases:
    {{- toYaml (required "mongodb.databases is delivered by the platform from the manifest's databases" .Values.mongodb.databases) | nindent 4 }}
  secretName: {{ .Values.mariadb.secretName }}
