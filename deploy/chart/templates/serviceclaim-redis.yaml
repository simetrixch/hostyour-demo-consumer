# The consumer's own Redis (manifest `redis: standalone`): the provisioner grants this unit's user its
# whole server and writes REDIS_URI into the Secret named here. A claim on an own server names no key
# or channel pattern; the CRD refuses an empty pattern list, and patterns are for the shared server.
apiVersion: platform.hostyour.cloud/v1alpha1
kind: ServiceClaim
metadata:
  name: redis
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  service: redis
  secretName: {{ .Values.redis.secretName }}
