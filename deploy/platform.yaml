# The demo consumer of the hostyour platform. It brings its own Redis and its own MariaDB, so a
# backup and a restore of a consumer's data services can be proven live by reading back what was
# written before (README.md, "The live proof").
apiVersion: hostyour.cloud/v1
kind: ConsumerManifest
name: hostyour-demo-consumer
host: demo
owner: platform
envs: [dev, test]
chart:
  path: deploy/chart
services: [redis, mariadb, registry-pull]
# Its own Redis server, which nothing else shares; the probe key lives there.
redis: standalone
# The one MariaDB database the probe's table lives in.
databases: [demo_probe]
builds:
  - name: hostyour-demo-consumer
    containerfile: Containerfile
