# The demo consumer of the hostyour platform: one pod with no data service, the slimmest unit the
# Manager onboards, so a stage's lifecycle (onboard, add a stage, offboard, restore) can be proven live
# at the smallest size.
apiVersion: hostyour.cloud/v1
kind: ConsumerManifest
name: hostyour-demo-consumer
host: demo
owner: platform
envs: [dev, test]
chart:
  path: deploy/chart
services: [registry-pull]
builds:
  - name: hostyour-demo-consumer
    containerfile: Containerfile
