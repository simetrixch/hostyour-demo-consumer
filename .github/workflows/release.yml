# Release — put a release of this repository on one stage, or release a library,
# from the GitHub UI.
#
# The job `release` is a thin wrapper around release/release.sh: it checks out
# the repo, sets a bot git identity, and runs the same dumb client an operator
# would run locally. It does NOT build anything.
#
# The ACTUAL build trigger is the deploy ref release.sh pushes
# (refs/tags/deploy/<stage>/<release-tag>), not this workflow: that push fires
# this repo's external push webhook (Settings -> Webhooks -> build.<domain>)
# into the platform's build plane, which runs the release build. A library
# (stage `none`) pushes no deploy ref: its release tag is the release. The push
# of the release tag fires the same webhook, and the build plane publishes the
# repository's npm packages from that tag.
name: Release

# Show the release in the Actions run list (otherwise every run reads
# "Release #N: Manually run by <user>" with no context on WHICH release).
run-name: "Release ${{ inputs.version }}-${{ inputs.channel }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version x.y.zzz (e.g. 0.8.000); exactly three patch digits"
        required: true
        type: string
      channel:
        description: "Maturity ceiling: alpha->dev, beta->test, stable->prod"
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
          - alpha
      stage:
        description: "Where this run puts the release, at or below the channel's ceiling; none for a library, which deploys nothing."
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod
          - none
      existing:
        description: "Put the release version-channel that already stands on origin on the stage, minting nothing (going back to an earlier release)"
        required: false
        type: boolean
        default: false
      from:
        description: "Commit the new release is minted on instead of the newest one: the code of a release that stands on another channel (release.sh --from)"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "example-release[bot]"
          git config user.email "218061504+example-release[bot]@users.noreply.github.com"

      # The inputs reach the shell as ENVIRONMENT values: an input written into
      # the script text would be script source whoever dispatches the run writes.
      - name: Mint the release tag and push the deploy ref
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          STAGE: ${{ inputs.stage }}
          EXISTING: ${{ inputs.existing && '--existing' || '' }}
          FROM: ${{ inputs.from }}
        run: bash release/release.sh "$VERSION" "$CHANNEL" "$STAGE" $EXISTING ${FROM:+--from "$FROM"}
